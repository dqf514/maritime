services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voyageos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyageos}
      POSTGRES_DB: ${POSTGRES_DB:-voyageos}
    ports:
      - "5432:5432"
    volumes:
      - voyageos_pg:/var/lib/postgresql/data
      # 注意：不要挂载 docs/ddl.sql 初始化——该文件与当前模型存在漂移，
      # 空库由 API 启动时 create_all 建表，再执行 `alembic stamp head` 登记基线。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voyageos} -d ${POSTGRES_DB:-voyageos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: docker.m.daocloud.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voyageos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voyageossecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - voyageos_minio:/data

  api:
    build:
      # 构建上下文必须是 mos/（fixtures 在 mos/fixtures，SelfCheck 依赖此布局）
      context: ../../
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-voyageos}:${POSTGRES_PASSWORD:-voyageos}@postgres:5432/${POSTGRES_DB:-voyageos}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  voyageos_pg:
  voyageos_minio:
