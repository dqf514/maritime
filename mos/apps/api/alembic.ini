# Alembic configuration for VoyageOS API.
# The effective database URL is NOT read from this file -- alembic/env.py sets
# it from app.config (DATABASE_URL env var) so dev (SQLite) and prod
# (Postgres) share one config. The value below is only a fallback placeholder.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite+pysqlite:///./voyageos_wave0.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
